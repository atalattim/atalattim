<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Maruti Atalatti — Developer Profile</title>
  <desc id="desc">Obsidian background with cyan and violet accents, a terminal motif, and a Computer Science student tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070A12"/><stop offset="0.58" stop-color="#101827"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67E8F9"/><stop offset="0.52" stop-color="#60A5FA"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <radialGradient id="glow" cx="80%" cy="28%" r="70%"><stop offset="0" stop-color="#6366F1" stop-opacity="0.24"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1072" cy="94" r="95" fill="#22D3EE" fill-opacity="0.08" filter="url(#blur)"/>
  <path d="M0 300 C260 240 390 380 650 310 S1080 250 1280 292" stroke="url(#accent)" stroke-opacity="0.22" stroke-width="1.5" fill="none"/>
  <rect x="72" y="56" width="5" height="248" rx="2.5" fill="url(#accent)"/>
  <text x="104" y="95" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4">BUILDING MY FOUNDATIONS</text>
  <text x="100" y="164" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">MARUTI</text>
  <text x="100" y="224" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">ATALATTI<span fill="#67E8F9">.</span></text>
  <text x="104" y="264" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Computer Science &amp; Engineering Student</text>
  <text x="104" y="294" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">LEARN  /  BUILD  /  DEBUG  /  REPEAT</text>
  <g transform="translate(855 82)">
    <rect width="330" height="188" rx="15" fill="#080D16" fill-opacity="0.88" stroke="#334155" stroke-width="1.2"/>
    <path d="M0 42H330" stroke="#334155"/>
    <circle cx="22" cy="21" r="5" fill="#FB7185"/><circle cx="40" cy="21" r="5" fill="#FBBF24"/><circle cx="58" cy="21" r="5" fill="#34D399"/>
    <text x="80" y="26" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">maruti@dev ~</text>
    <text x="22" y="76" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="14">$ whoami</text>
    <text x="22" y="100" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13">computer science student</text>
    <text x="22" y="129" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="14">$ focus --now</text>
    <text x="22" y="153" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="13">C · Python · Web basics</text>
    <rect x="22" y="166" width="8" height="13" rx="1" fill="#67E8F9" opacity="0.9"/>
  </g>
  <text x="1185" y="324" text-anchor="end" fill="#64748B" font-family="ui-monospace, monospace" font-size="12">@ATALATTIM</text>
</svg>
